; Streamdeck - touch macro deck + now playing for the Hosyond/LCDWiki 2.8" ESP32-S3 board (ES3C28P)
; ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM), ILI9341V 240x320 SPI, FT6336 capacitive touch, microSD (SDMMC)

[env:es3c28p]  ; the real firmware
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    lvgl/lvgl@8.3.6
    bblanchon/ArduinoJson@^7.4.1

; lib/TFT_eSPI (patched copy from the vendor demo package), lib/FT6336 and lib/ES8311 (vendor codec
; driver, patched to use Wire) are vendored in lib/.
build_flags =
    -Iinclude
    -DBOARD_HAS_PSRAM
    ; Serial over the native USB-C port (USB-Serial/JTAG): no UART bridge on this board
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; LVGL
    -DLV_CONF_INCLUDE_SIMPLE
    ; TFT_eSPI setup (pins from the board schematic / LCDWiki page)
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT
