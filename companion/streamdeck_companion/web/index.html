<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="sd-token" content="__TOKEN__">
<title>Deck editor</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="topbar"></header>
<div id="banner" hidden></div>
<main id="deckView">
  <aside id="tree">
    <div id="treeList"></div>
  </aside>
  <section id="stage">
    <div id="screenMount"></div>
    <div id="pageControls"></div>
    <div id="liveConfig"></div>
    <div id="presets"></div>
  </section>
  <aside id="inspector"></aside>
</main>
<section id="settingsPage" hidden></section>
<div id="toast" hidden></div>
<noscript>This editor needs JavaScript.</noscript>
<script type="module" src="/app.js"></script>
<datalist id="runningApps"></datalist>
</body>
</html>
